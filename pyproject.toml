[project]
name = "gem-screening"
version = "1.3.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benoit Roux", email = "benoit.roux@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "a1-manager",
    "celltinder",
    "cp-server",
    "progress-bar",
    "pydantic>=2.11.6",
    "pyqt6>=6.9.1",
]

[project.scripts]
gem-screening = "gem_screening.gui.main_window:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv.workspace]
members = [
    "A1_manager",
    "CP_server",
    "CellTinder",
    "Cellpose-kit",
    "Progress_bar",
]

[tool.uv.sources]
a1-manager = { workspace = true }
cp-server = { workspace = true }
celltinder = { workspace = true }
cellpose-kit = { workspace = true }
progress-bar = { workspace = true }
